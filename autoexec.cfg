// aliases
alias "kitsune" "map_workshop 3076153623 surf_kitsune"
alias "aimbotz" "map_workshop 3070244462 aim_botz"
alias "dc" "disconnect"

// settings
    // set brightness to look like csgo
r_fullscreen_gamma 3 
    // set color to purple
cl_color 4
    // set hud color to teammate color
cl_hud_color 12
    // glow weapon with rarity color
cl_weapon_selection_rarity_color true
    // disable animated avatars
cl_allow_animated_avatars false
    // disable sniper inaccuracy
cl_sniper_show_inaccuracy false
    // disable all prediction
cl_predict_body_shot_fx false
cl_predict_head_shot_fx false
cl_predict_kill_ragdolls false
    // disable friendly fire crosshair
cl_crosshair_friendly_warning 0
    // always show fps and ping
cl_hud_telemetry_frametime_show 2
    // disable build info in bottom left
r_show_build_info false
    // 50% volume
volume 0.25
    // play audio when game is minimized
snd_mute_losefocus false
    // disable all music except main menu and mvp
snd_deathcamera_volume 0
snd_mapobjective_volume 0
snd_roundend_volume 0
snd_tensecondwarning_volume 0
snd_menumusic_volume 0.0625
snd_mvp_volume 0.0625
    // set fps
fps_max 1000
fps_max_ui 1000
